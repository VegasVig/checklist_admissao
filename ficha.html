<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b11">
<title>Ficha de admissão — Vegas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/admissao.css">
</head>
<body class="escuro candidato">

<header class="topo">
  <div class="marca">
    <img class="escudo" src="img/escudo.png" alt="">
    <img id="logoTopo" class="nome" alt="Vegas Vigilância e Segurança">
  </div>
  <p class="lema">Pessoas seguras<br>fazem um mundo<br><b>mais seguro</b></p>
  <div class="topo-dir"><span class="t">Ficha de admissão</span></div>
</header>

<main class="env" id="tela">
  <p class="vazio">Abrindo sua ficha…</p>
</main>

<div class="rodape no-print" id="rodape" hidden>
  <div class="dentro">
    <div class="estado" id="estado">
      <b>Falta preencher</b>
      <span class="lista" id="listaFalta"></span>
    </div>
    <button class="btn" id="btnEnviar">Enviar ficha</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/logo.js"></script>
<script src="js/campos.js"></script>
<script src="js/api.js"></script>
<script src="js/documento.js"></script>
<script src="js/ficha.js"></script>
</body>
</html>
