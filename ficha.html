<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14181d">
<title>Ficha de admissão — Vegas</title>
<link rel="stylesheet" href="css/admissao.css">
</head>
<body class="claro">

<header class="topo">
  <img id="logoTopo" alt="Vegas Vigilância e Segurança">
  <span class="t">Ficha de admissão</span>
</header>

<main class="env" id="tela">
  <p class="vazio">Abrindo sua ficha…</p>
</main>

<div class="rodape no-print" id="rodape" hidden>
  <div class="dentro">
    <div class="estado" id="estado">
      <b>Falta preencher</b>
      <span class="lista" id="listaFalta"></span>
    </div>
    <button class="btn" id="btnEnviar">Enviar ficha</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/logo.js"></script>
<script src="js/campos.js"></script>
<script src="js/api.js"></script>

</html>
